[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyth-hermes"
version = "0.1.1"
description = "Python client for the Pyth Network Hermes price-oracle API (sync + async, SSE streaming)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Robert Ruben" }]
keywords = ["pyth", "hermes", "oracle", "price-feed", "defi", "solana"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic>=2.6",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    "pandas>=2.0",
    "pandas-stubs",
]

[project.urls]
Homepage = "https://github.com/robertruben98/pyth-hermes"
Repository = "https://github.com/robertruben98/pyth-hermes"
Documentation = "https://docs.pyth.network/price-feeds/core/how-pyth-works/hermes"
Issues = "https://github.com/robertruben98/pyth-hermes/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyth_hermes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live network tests against the real Hermes API (skipped by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# Target is Python 3.9; pydantic v2 resolves field annotations at runtime, where
# `Optional[X]` is safer than PEP 604 `X | None`. Keep explicit Optional.
ignore = ["UP045", "UP007"]

[tool.mypy]
# Analysis floor; the package itself supports >=3.9 at runtime. Pinned to 3.12
# to match the CI interpreter so newer dependency stubs (numpy PEP 695 `type`
# statements) parse under mypy.
python_version = "3.12"
strict = true
files = ["src", "tests", "examples"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true
